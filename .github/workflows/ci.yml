name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit production dependencies
        run: yarn audit:ci

      - name: Verify
        run: yarn verify

      - name: Validate production compose config
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        env:
          ATHLETE_DEVELOPMENT_WEB_IMAGE: ghcr.io/example/athlete-development-web:test
          AUTH_SECRET: placeholder-secret-at-least-32-chars
          AUTH_TOKEN_SALT: authjs.session-token
          AUTH_URL: https://acent.app
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          NGINX_HTTP_PORT: "80"
          NGINX_HTTPS_PORT: "443"
          LETSENCRYPT_DIR: /etc/letsencrypt
          CERTBOT_WEBROOT_DIR: /var/www/certbot
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate nginx config
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          mkdir -p "$RUNNER_TEMP/letsencrypt/live/acent.app"
          mkdir -p "$RUNNER_TEMP/certbot/.well-known/acme-challenge"

          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/letsencrypt/live/acent.app/privkey.pem" \
            -out "$RUNNER_TEMP/letsencrypt/live/acent.app/fullchain.pem" \
            -subj "/CN=acent.app"

          docker run --rm \
            --add-host web:127.0.0.1 \
            -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
            -v "$RUNNER_TEMP/certbot:/var/www/certbot:ro" \
            nginx:1.27-alpine nginx -t

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy]'))

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy image tag
        id: image
        run: echo "image_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/athlete-development-web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.acent.app
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
